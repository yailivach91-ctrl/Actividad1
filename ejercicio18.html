<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - Manipulación del DOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/ejercicio18.css">
</head>
<body>

    <div class="contenedor">
        <h1>Lista Dinámica</h1>
        <p class="subtitulo">Manipulación del DOM con Bootstrap y JavaScript</p>

        <form class="formulario" onsubmit="event.preventDefault(); agregarElemento();">
            <div class="grupo-formulario">
                <label for="nuevoElemento">Nuevo elemento:</label>
                <input type="text" id="nuevoElemento" placeholder="Escribe algo para la lista">
            </div>

            <button type="button" id="agregarBtn" class="boton-calcular">Agregar</button>

            <ul id="lista" class="lista-items"></ul>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ejercicio18.js"></script>
</body>
</html>
