<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - calculadora kilometros a millas</title>
    <script src="js/ejercicio11.js"></script>
    <link rel="stylesheet" href="css/ejercicio11.css">
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de Distancia</h1>
        <p>Convierte entre Kilómetros y Millas.</p>
        <form class="formulario">
            <div class="grupo-formulario">
                <label for="kilometros">Kilómetros:<br></label>
                <input type="number" id="kilometros" name="kilometros" placeholder="Ingresa la distancia en Kilómetros">
            </div>
            <div class="grupo-formulario">
                <label for="millas">Millas:<br></label>
                <input readonly type="text" id="millas" name="millas" placeholder="Resultado en Millas">
            </div>
            <button type="button"` onclick="conversion()" class="boton-calcular">Calcular</button>
        </form>
    </div>
    
</body>
</html>
