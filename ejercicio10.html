<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - calculadora celsius fahrenheit</title>
    <script src="js/ejercicio10.js"></script>
    <link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de Temperatura</h1>
        <p>Convierte entre Celsius y Fahrenheit.</p>
        <form class="formulario">
            <div class="grupo-formulario">
                <label for="celsius">Celsius:<br></label>
                <input type="number" id="celsius" name="celsius" placeholder="Ingresa la temperatura en Celsius">
            </div>
            <div class="grupo-formulario">
                <label for="fahrenheit">Fahrenheit:<br></label>
                <input readonly type="text" id="fahrenheit" name="fahrenheit" placeholder="Resultado en Fahrenheit">
            </div>
            <button type="button"` onclick="conversion()" class="boton-calcular">Calcular</button>
        </form>
    </div>
    
</body>
</html>
