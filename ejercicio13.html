<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Calculadora de voto</title>
    <script src="js/ejercicio13.js"></script>
    <link rel="stylesheet" href="css/ejercicio12.css">
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de Voto</h1>
        <p>Puedes votar?</p>
        <form class="formulario">
            <div class="grupo-formulario">
                <label for="edad">Edad:<br></label>
                <input type="number" id="edad" name="edad" placeholder="Ingresa tu edad">
            </div>
            <div class="grupo-formulario">
                <label for="resultado">Resultado:<br></label>
                <input readonly type="text" id="resultado" name="resultado" placeholder="Puedes votar?">
            </div>
            <button type="button" onclick="calcular()" class="boton-calcular">Verificar</button>
            
        </form>
    </div>
</body>
</html>
