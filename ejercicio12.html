<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12 - Pesos Mexicanos a Dólares</title>
    <script src="js/ejercicio12.js"></script>
    <link rel="stylesheet" href="css/ejercicio12.css">
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de Moneda</h1>
        <p>Convierte entre Pesos Mexicanos y Dólares.</p>
        <form class="formulario">
            <div class="grupo-formulario">
                <label for="pesos">Pesos Mexicanos:<br></label>
                <input type="number" id="pesos" name="pesos" placeholder="Ingresa la cantidad en Pesos Mexicanos">
            </div>
            <div class="grupo-formulario">
                <label for="dolares">Dólares:<br></label>
                <input readonly type="text" id="dolares" name="dolares" placeholder="Resultado en Dólares">
            </div>
            <button type="button" onclick="conversion()" class="boton-calcular">Calcular</button>
        </form>
    </div>
</body>
</html>
